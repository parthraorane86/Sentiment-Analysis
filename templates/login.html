<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Complaint Management System</title>
  <meta name="description" content="Secure login page for the Complaint Management System admin panel."/>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      position: relative;
      overflow: hidden;
    }

    /* Animated background orbs */
    body::before {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(102, 66, 255, 0.35) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      border-radius: 50%;
      animation: float1 8s ease-in-out infinite;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 200, 255, 0.25) 0%, transparent 70%);
      bottom: -80px;
      right: -80px;
      border-radius: 50%;
      animation: float2 10s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.1); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-30px, -40px) scale(1.08); }
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
      position: relative;
      z-index: 10;
    }

    /* Glassmorphism card */
    .login-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }

    /* Brand logo area */
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #fff;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.5);
      animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 8px 24px rgba(124, 58, 237, 0.5); }
      50%       { box-shadow: 0 8px 36px rgba(59, 130, 246, 0.7); }
    }

    .login-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
    }

    /* Form elements */
    .form-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .input-group-text {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-right: none;
      color: rgba(255, 255, 255, 0.5);
      border-radius: 10px 0 0 10px;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: none;
      color: #ffffff;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border-radius: 0 10px 10px 0;
      transition: all 0.3s ease;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(124, 58, 237, 0.7);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
      color: #ffffff;
      outline: none;
    }

    /* Toggle password visibility */
    .btn-eye {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: none;
      color: rgba(255, 255, 255, 0.5);
      border-radius: 0 10px 10px 0 !important;
      padding: 0 0.85rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn-eye:hover {
      color: rgba(255, 255, 255, 0.9);
    }

    /* Login button */
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #9f67ff, #60a5fa);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .btn-login:hover::before { opacity: 1; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(124, 58, 237, 0.5); }
    .btn-login:active { transform: translateY(0); }
    .btn-login span { position: relative; z-index: 1; }

    /* Error alert */
    .alert-login-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 0.875rem;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: shakeX 0.5s ease both;
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-5px); }
      80%       { transform: translateX(5px); }
    }

    /* Back to homepage link */
    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }

    .back-link a {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.8rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link a:hover { color: rgba(255, 255, 255, 0.75); }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      margin: 1.5rem 0;
    }

    /* Lock icon badge */
    .lock-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: rgba(255,255,255,0.35);
      font-size: 0.75rem;
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <!-- Brand -->
    <div class="login-brand">
      <div class="brand-logo">
        <i class="bi bi-stars"></i>
      </div>
      <h1 class="login-title">Admin Login</h1>
      <p class="login-subtitle">Complaint Management System</p>
    </div>

    <!-- Flash error messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert-login-error mb-3" role="alert">
            <i class="bi bi-exclamation-circle-fill"></i>
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('login') }}" autocomplete="off" id="login-form">

      <!-- Username -->
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
            autofocus
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="off"
            style="border-radius: 0;"
          />
          <button type="button" class="btn-eye" id="toggle-password" title="Show/hide password">
            <i class="bi bi-eye-fill" id="eye-icon"></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-login" id="login-btn">
        <span><i class="bi bi-shield-lock-fill me-2"></i>Sign In to Dashboard</span>
      </button>

    </form>

    <div class="divider"></div>

    <!-- Security note -->
    <div class="lock-badge">
      <i class="bi bi-shield-check-fill" style="color: #7c3aed;"></i>
      Restricted access — authorised personnel only
    </div>

    <!-- Back link -->
    <div class="back-link">
      <a href="{{ url_for('index') }}"><i class="bi bi-arrow-left me-1"></i>Back to Review Form</a>
    </div>

  </div>
</div>

<script>
  // Toggle password visibility
  const toggleBtn = document.getElementById('toggle-password');
  const pwdInput  = document.getElementById('password');
  const eyeIcon   = document.getElementById('eye-icon');

  toggleBtn.addEventListener('click', () => {
    const isHidden = pwdInput.type === 'password';
    pwdInput.type = isHidden ? 'text' : 'password';
    eyeIcon.className = isHidden ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill';
  });

  // Button loading state on submit
  document.getElementById('login-form').addEventListener('submit', function () {
    const btn = document.getElementById('login-btn');
    btn.innerHTML = '<span><i class="bi bi-arrow-repeat me-2" style="animation: spin 0.8s linear infinite;display:inline-block"></i>Signing in…</span>';
    btn.disabled = true;
  });
</script>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

</body>
</html>
